{% load static %}

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>LITRevu</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>
    <main class="container mt-4 mb-5">
        {% if user.is_authenticated %}
            <nav class="site-nav mb-4">
                <a href="{% url 'accueil' %}" class="me-3 text-decoration-none">
                    Accueil
                </a>

                <a href="{% url 'mes_posts' %}" class="me-3 text-decoration-none">
                    Mes posts
                </a>

                <a href="{% url 'abonnements' %}" class="me-3 text-decoration-none">
                    Abonnements
                </a>

                <a href="{% url 'deconnexion' %}" class="text-decoration-none">
                    Se déconnecter
                </a>
            </nav>
        {% endif %}

        <section class="page-content">
            {% block content %}
            {% endblock content %}
        </section>
    </main>
</body>
</html>
