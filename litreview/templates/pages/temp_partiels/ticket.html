<div class="card mb-5">
    <div class="card-body">
        <p class="text-muted">
            Demande faite le {{ ticket.time_created|date:"d/m/y à H:i" }}
        </p>

        <h3 class="card-title">{{ ticket.title }}</h3>

        {% if ticket.description %}
            <p class="card-text">{{ ticket.description }}</p>
        {% endif %}
    </div>
</div>
