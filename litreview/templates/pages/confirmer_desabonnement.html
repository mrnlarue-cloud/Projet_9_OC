{% extends "pages/base.html" %}

{% block content %}
    <h1>Confirmer le désabonnement</h1>

    <p>
        Êtes-vous certaine de vouloir arrêter de suivre
        <strong>{{ abonnement.followed_user.username }}</strong> ?
    </p>

    <form
        method="post"
        action="{% url 'desabonnement' abonnement.followed_user.id %}"
    >
        {% csrf_token %}

        <button type="submit" class="btn btn-primary">
            Confirmer le désabonnement
        </button>
    </form>

    <p class="mt-3">
        <a href="{% url 'abonnements' %}">
            Annuler et retourner aux abonnements
        </a>
    </p>
{% endblock content %}
